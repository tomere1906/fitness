<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <!-- הגדרות לאייפון: פתיחה במסך מלא מהמסך הבית -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="כושר">
  <title>כושר</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Inter: פונט גיבוי למכשירים שאינם של אפל (באייפון משתמשים בפונט המערכת SF Pro) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- מבנה של אפליקציה: כותרת קבועה למעלה, תוכן שנגלל באמצע, סרגל ניווט קבוע למטה -->
  <header id="topbar"></header>

  <!-- כאן מוצג המסך הנוכחי (ה-JavaScript ממלא אותו) -->
  <main id="app"></main>

  <!-- סרגל ניווט תחתון (ה-JavaScript ממלא אותו באייקונים) -->
  <nav class="tabbar"></nav>
</body>
</html>
